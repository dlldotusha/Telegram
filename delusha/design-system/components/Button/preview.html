<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"></head>
<body>
<div class="dg-stage col">
 <div class="dg-stage" style="padding:0"><button class="dg-btn filled"><span class="dg-ic">send</span>Отправить</button><button class="dg-btn tonal">Ответить</button><button class="dg-btn outlined">Отмена</button><button class="dg-btn text">Подробнее</button><button class="dg-btn danger"><span class="dg-ic">delete</span>Удалить</button><button class="dg-btn filled" disabled>Недоступно</button></div>
 <div class="dg-stage" style="padding:0"><button class="dg-btn filled xs">XS</button><button class="dg-btn filled">S</button><button class="dg-btn filled m"><span class="dg-ic">call</span>M</button><button class="dg-btn tonal l"><span class="dg-ic">videocam</span>L</button></div>
 <div class="dg-stage" style="padding:0"><span class="dg-cap">Переключатель:</span><button class="dg-btn toggle" data-toggle aria-pressed="true"><span class="dg-ic">visibility_off</span>Призрак</button><button class="dg-btn toggle" data-toggle aria-pressed="false"><span class="dg-ic">notifications_off</span>Без звука</button></div>
</div>
<script>document.querySelectorAll('[data-toggle]').forEach(function(b){b.addEventListener('click',function(){var g=b.closest('[data-single]');if(g){g.querySelectorAll('[data-toggle]').forEach(function(x){x.setAttribute(x.hasAttribute('aria-current')?'aria-current':'aria-pressed',x===b?(x.hasAttribute('aria-current')?'page':'true'):(x.hasAttribute('aria-current')?'false':'false'))})}else{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true')}})});</script>
</body>
</html>
