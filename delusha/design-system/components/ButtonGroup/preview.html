<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"></head>
<body>
<div class="dg-stage col" style="max-width:360px">
 <div class="dg-bgroup tall" data-single>
  <button class="dg-btn filled" data-toggle aria-pressed="true"><span class="dg-ic fill">chat_bubble</span>Чат</button>
  <button class="dg-btn tonal" data-toggle aria-pressed="false"><span class="dg-ic">notifications_off</span>Звук</button>
  <button class="dg-btn tonal" data-toggle aria-pressed="false"><span class="dg-ic">call</span>Звонок</button>
  <button class="dg-btn tonal" data-toggle aria-pressed="false"><span class="dg-ic">videocam</span>Видео</button>
 </div>
 <div class="dg-bgroup" data-single>
  <button class="dg-btn toggle" data-toggle aria-pressed="true">Медиа</button>
  <button class="dg-btn toggle" data-toggle aria-pressed="false">Файлы</button>
  <button class="dg-btn toggle" data-toggle aria-pressed="false">Голосовые</button>
  <button class="dg-btn toggle" data-toggle aria-pressed="false">Ссылки</button>
 </div>
</div>
<script>document.querySelectorAll('[data-toggle]').forEach(function(b){b.addEventListener('click',function(){var g=b.closest('[data-single]');if(g){g.querySelectorAll('[data-toggle]').forEach(function(x){x.setAttribute(x.hasAttribute('aria-current')?'aria-current':'aria-pressed',x===b?(x.hasAttribute('aria-current')?'page':'true'):(x.hasAttribute('aria-current')?'false':'false'))})}else{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true')}})});</script>
</body>
</html>
