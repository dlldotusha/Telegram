<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
<style>
html,body{margin:0}
.p{width:1600px;height:1000px;display:grid;grid-template-columns:620px 1fr;gap:16px;padding:16px;box-sizing:border-box;background:#141218;font-family:"Roboto Flex",sans-serif}
.c{border-radius:40px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:28px}
.cap{position:absolute;left:24px;bottom:18px;font:600 15px/20px "Roboto Flex";letter-spacing:.4px;opacity:.65}
.r{display:grid;grid-template-rows:1fr 1fr 1.15fr;gap:16px}
.row{display:grid;gap:16px}
.wm span{font:900 64px/1 "Roboto Flex";letter-spacing:-3px;font-variation-settings:"wdth" 151,"opsz" 96;color:#ece6f6;margin-left:-16px}
.i{flex:none;width:132px;height:132px;overflow:hidden}
.nm{display:flex;align-items:center;gap:8px;font:800 30px/1 "Roboto Flex";font-variation-settings:"wdth" 120}
.col{display:flex;flex-direction:column;align-items:center;gap:14px;font:600 14px/18px "Roboto Flex"}
.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:800 32px/1 "Roboto Flex";position:relative}
.av img{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:10px;box-shadow:0 0 0 5px #f6f2fb}
</style></head><body><div class="p">
 <div class="c" style="background:#efe9fb"><img src="logo/mark-varied.svg" width="400"><div class="cap" style="color:#331f5a">Знак: D из разных пикселей</div></div>
 <div class="r">
  <div class="row" style="grid-template-columns:1.6fr 1fr">
   <div class="c wm" style="background:#1d1a24"><img src="logo/mark-varied-dark.svg" width="60"><span>elushaGram</span><div class="cap" style="color:#ece6f6">Надпись</div></div>
   <div class="c" style="background:#f6f2fb"><div class="i" style="border-radius:50%"><img src="logo/app-icon.svg" width="132"></div><div class="cap" style="color:#331f5a">Иконка</div></div>
  </div>
  <div class="row" style="grid-template-columns:1fr 1fr">
   <div class="c" style="background:#f6f2fb;color:#1d1a24"><div class="nm">Аня Соколова<img src="logo/badge-supporter.svg" width="32"></div><div class="cap" style="color:#331f5a">Поддержал: рядом с именем везде</div></div>
   <div class="c" style="background:#f6f2fb;color:#1d1a24"><div class="nm">Даша<img src="logo/badge-user.svg" width="32"></div><div class="cap" style="color:#331f5a">Пользователь DelushaGram: только в профиле</div></div>
  </div>
  <div class="c" style="background:#f6f2fb;gap:70px"><div class="col"><div class="av" style="background:#ffe0da;color:#6b2a1e">М<span style="position:absolute;right:0;bottom:0;width:24px;height:24px;border-radius:50%;background:#2e9e5b;box-shadow:0 0 0 5px #f6f2fb"></span></div>В сети, обычный клиент</div><div class="col"><div class="av" style="background:#d9ecf2;color:#14424f">Д<img src="logo/badge-online.svg"></div>В сети с DelushaGram</div><div class="cap" style="color:#331f5a">Онлайн</div></div>
 </div>
</div></body></html>
